<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quiz Game</title>

<link rel="stylesheet"
href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>


<body>

<div class="bg-animation"></div>


<div class="quiz-container">


<div class="quiz-card">


<h2 id="levelTitle">
Level 1
</h2>



<div class="timer">

    ⏳ Time Left :

    <span id="timer">10</span>

</div>




<div class="progress">


<div class="progress-fill"
id="progressFill">


</div>


</div>





<p id="questionNumber">

Question 1 / 5

</p>





<div id="question">

Question appears here

</div>





<div id="answers">


</div>





<div class="status">


<div>

✅ Correct :

<span id="correct">

0

</span>


</div>



<div>

❌ Wrong :

<span id="wrong">

0

</span>


</div>


</div>





<button id="nextBtn">


Next →


</button>





</div>


</div>



<script src="questions.js"></script>

<script src="script.js"></script>


</body>

</html>
