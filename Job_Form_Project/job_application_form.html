





 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Job Application Form</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="job_application.css">
</head>

<body>

<div class="container">

    <h1>💼 Job Application</h1>
    <p class="subtitle">Fill in your details below</p>

    <form id="jobForm">

        <!-- Full Name -->
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required>

        <!-- Email -->
        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required>

        <!-- Phone -->
        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="+91 9876543210"
            required>

        <!-- Job Position -->
        <label for="position">Job Position</label>

        <select id="position" required>
            <option value="" selected disabled>Select Position</option>
            <option value="frontend">Frontend Developer</option>
            <option value="backend">Backend Developer</option>
            <option value="fullstack">Full Stack Developer</option>
            <option value="python">Python Developer</option>
            <option value="java">Java Developer</option>
            <option value="designer">UI / UX Designer</option>
            <option value="tester">Software Tester</option>
            <option value="analyst">Data Analyst</option>
        </select>

        <!-- Experience -->
        <label for="experience">Years of Experience</label>

        <input
            type="number"
            id="experience"
            placeholder="Enter experience"
            min="0"
            required>

        <!-- Availability -->

        <fieldset>

            <legend>Availability</legend>

            <div class="radio-container">

                <label>
                    <input
                        type="radio"
                        name="availability"
                        value="Full-Time"
                        required>

                    Full-Time
                </label>

                <label>
                    <input
                        type="radio"
                        name="availability"
                        value="Part-Time">

                    Part-Time
                </label>

                <label>
                    <input
                        type="radio"
                        name="availability"
                        value="Remote">

                    Remote
                </label>

            </div>

        </fieldset>

        <!-- Resume -->

        <label for="resume">Upload Resume</label>

        <input
            type="file"
            id="resume"
            accept=".pdf,.doc,.docx"
            required>

        <!-- Cover Letter -->

        <label for="message">Cover Letter</label>

        <textarea
            id="message"
            rows="6"
            placeholder="Tell us why you're a good fit for this position..."
            required></textarea>

        <!-- Submit -->

        <button type="submit">
            🚀 Submit Application
        </button>

    </form>

</div>

<script>

document.getElementById("jobForm").addEventListener("submit", function(e){

    e.preventDefault();

    alert("🎉 Application Submitted Successfully!");

    this.reset();

});

</script>

</body>
</html>
